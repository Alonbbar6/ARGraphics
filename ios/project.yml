name: ARGraphics
options:
  bundleIdPrefix: app.argraphics
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # Signing: automatic, with the team from Config/Secrets.xcconfig (ARGRAPHICS_TEAM_ID).
    # Simulator and CI builds pass CODE_SIGNING_ALLOWED=NO and ignore this.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(ARGRAPHICS_TEAM_ID)
targets:
  ARGraphics:
    type: application
    platform: iOS
    sources:
      - path: ARGraphics
        excludes:
          - "Resources/ARGraphics.entitlements"
    info:
      path: ARGraphics/Resources/Info.plist
      properties:
        CFBundleDisplayName: ARGraphics
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIRequiredDeviceCapabilities: [arm64]
        UIUserInterfaceStyle: Dark
        NSCameraUsageDescription: ARGraphics uses the camera to read the code at your table and show tonight's specials, art and offers right where you are.
        NSPhotoLibraryAddUsageDescription: ARGraphics saves the photos and clips you take so you can share them.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Only HTTPS to our own API; no proprietary encryption, so TestFlight needs no export form.
        ITSAppUsesNonExemptEncryption: false
        ARGraphicsAPIBaseURL: $(ARGRAPHICS_API_BASE_URL)
        ARGraphicsIOSAPIKey: $(ARGRAPHICS_IOS_API_KEY)
        CFBundleURLTypes:
          - CFBundleURLName: app.argraphics.visitor
            CFBundleURLSchemes: [argraphics]
    settings:
      base:
        PRODUCT_NAME: ARGraphics
        PRODUCT_BUNDLE_IDENTIFIER: app.argraphics.visitor
        CODE_SIGN_ENTITLEMENTS: ARGraphics/Resources/ARGraphics.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  ARGraphicsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ARGraphicsTests]
    dependencies:
      - target: ARGraphics
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.argraphics.visitor.tests
schemes:
  ARGraphics:
    build:
      targets:
        ARGraphics: all
        ARGraphicsTests: [test]
    test:
      targets: [ARGraphicsTests]
