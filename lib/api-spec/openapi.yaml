        redemptionsThisWeek: { type: integer }
        floorX: { type: ["number", "null"], description: "Position on the venue floor plan, 0..1 left to right; null until placed." }
        floorY: { type: ["number", "null"], description: "Position on the venue floor plan, 0..1 top to bottom; null until placed." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, type, placement, status, title, description, drinkId, drink, mediaUrl, offer, eventStartsAt, artist, artworkId, artwork, scansThisWeek, redemptionsThisWeek, floorX, floorY, createdAt, updatedAt]
    DisplayArtwork:
      type: object
      description: The licensed artwork a display shows; media and credit come from it.
      properties:
        id: { type: string }
        title: { type: string }
        medium: { $ref: "#/components/schemas/ArtworkMedium" }
        modelGlbUrl: { type: ["string", "null"] }
      required: [id, title, medium, modelGlbUrl]
    DisplayInput:
      type: object
      additionalProperties: false
      properties:
        type: { $ref: "#/components/schemas/DisplayType" }
        placement: { $ref: "#/components/schemas/Placement" }
        status: { type: string, enum: [draft, live] }
        title: { type: string, minLength: 1, maxLength: 80, pattern: "\\S" }
        description: { type: string, maxLength: 600 }
        drinkId: { type: ["string", "null"], maxLength: 120 }
        mediaObjectPath: { type: ["string", "null"], pattern: "^/objects/uploads/[a-f0-9-]{36}$" }
        offer:
          oneOf:
            - $ref: "#/components/schemas/OfferInput"
            - type: "null"
        eventStartsAt: { type: ["string", "null"], format: date-time }
        artistName: { type: ["string", "null"], maxLength: 80 }
        artistSlug: { type: ["string", "null"], maxLength: 120 }
        artworkId: { type: ["string", "null"], maxLength: 120 }
      required: [type, placement, title]
    DisplayUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        placement: { $ref: "#/components/schemas/Placement" }
        status: { $ref: "#/components/schemas/DisplayStatus" }
        title: { type: string, minLength: 1, maxLength: 80, pattern: "\\S" }
        description: { type: string, maxLength: 600 }
        drinkId: { type: ["string", "null"], maxLength: 120 }
        mediaObjectPath: { type: ["string", "null"], pattern: "^/objects/uploads/[a-f0-9-]{36}$" }
        offer:
          oneOf:
            - $ref: "#/components/schemas/OfferInput"
            - type: "null"
        eventStartsAt: { type: ["string", "null"], format: date-time }
        artistName: { type: ["string", "null"], maxLength: 80 }
        artistSlug: { type: ["string", "null"], maxLength: 120 }
        artworkId: { type: ["string", "null"], maxLength: 120 }
        floorX: { type: ["number", "null"], minimum: 0, maximum: 1 }
        floorY: { type: ["number", "null"], minimum: 0, maximum: 1 }
    QrCode:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        placement: { $ref: "#/components/schemas/Placement" }
        displayId: { type: ["string", "null"] }
        displayTitle: { type: ["string", "null"] }
        code: { type: string }
