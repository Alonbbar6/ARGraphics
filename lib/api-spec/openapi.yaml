components:
  responses:
    Unauthorized:
      description: Owner sign-in required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found for this owner
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: The request could not be completed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code:
          type: string
          description: Machine-readable reason when the client should offer a next step (plan_limit, no_credits).
    SavedPhotoCleanup:
      type: object
      required: [id, drinkId, status, sourcePhotoPath, cleanedPhotoPath, error, createdAt]
      properties:
        id: { type: string }
        drinkId: { type: string }
        status: { type: string, enum: [processing, ready, failed, discarded] }
        sourcePhotoPath: { type: string }
        cleanedPhotoPath: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Message:
      type: object
      properties:
        message: { type: string }
      required: [message]
    Session:
      type: object
      properties:
        authenticated: { type: boolean }
        userName: { type: ["string", "null"] }
        barName: { type: ["string", "null"] }
        barSlug: { type: ["string", "null"] }
        partnerKind:
          oneOf:
            - $ref: "#/components/schemas/AccountKind"
            - type: "null"
        plan:
          oneOf:
            - $ref: "#/components/schemas/PlanTier"
            - type: "null"
      required: [authenticated, userName, barName, barSlug, partnerKind, plan]
    PasswordRecoveryInput:
      type: object
      properties:
        email: { type: string, format: email, maxLength: 254 }
      required: [email]
    PasswordReplacementInput:
      type: object
      properties:
        token: { type: string, pattern: "^[A-Za-z0-9_-]{43}$", minLength: 43, maxLength: 43 }
        password: { type: string, minLength: 12, maxLength: 72 }
      required: [token, password]
    LoginInput:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 72 }
      required: [email, password]
    OwnerRegistrationInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        barName: { type: string, minLength: 2, maxLength: 80 }
        venueType: { $ref: "#/components/schemas/VenueType" }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 72 }
        kind: { $ref: "#/components/schemas/AccountKind" }
      required: [name, barName, email, password]
    Drink:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        priceCents: { type: integer }
        category: { type: string }
        isAvailable: { type: boolean }
        isPublished: { type: boolean }
        sortOrder: { type: integer }
        thumbnailUrl: { type: ["string", "null"] }
        generationStatus: { type: string }
        generationProgress: { type: integer }
        modelGlbUrl: { type: ["string", "null"], format: uri }
        modelUsdzUrl: { type: ["string", "null"], format: uri }
        generationError: { type: ["string", "null"] }
        updatedAt: { type: string, format: date-time }
        realHeightCm:
          type: ["number", "null"]
          description: Real-world height in centimetres the AR app renders this model at; null uses the app default.
      required: [id, name, description, priceCents, category, isAvailable, isPublished, sortOrder, thumbnailUrl, generationStatus, generationProgress, modelGlbUrl, modelUsdzUrl, generationError, updatedAt, realHeightCm]
    DrinkPhotoUploadInput:
      type: object
      properties:
        drinkId: { type: string }
        kind: { type: string, enum: [original, cleaned] }
        name: { type: string, minLength: 1, maxLength: 255 }
        size:
          type: integer
          minimum: 1
          description: Image byte size; no greater than 15728640 (15 MB).
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
      required: [drinkId, kind, name, size, contentType]
    DrinkPhotoUpload:
      type: object
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
      required: [uploadURL, objectPath]
    DrinkGenerationInput:
      type: object
      properties:
        sourcePhotoPath: { type: string, minLength: 1 }
        cleanedPhotoPath: { type: string, minLength: 1 }
      required: [sourcePhotoPath, cleanedPhotoPath]
    DrinkGeneration:
      type: object
      properties:
        status: { type: string, enum: [none, uploaded, processing, ready, failed] }
        progress:
          type: integer
          description: Generation progress from 0 to 100.
        error: { type: ["string", "null"] }
        sourcePhotoUrl: { type: ["string", "null"], format: uri }
        cleanedPhotoUrl: { type: ["string", "null"], format: uri }
        modelGlbUrl: { type: ["string", "null"], format: uri }
        thumbnailUrl: { type: ["string", "null"], format: uri }
      required: [status, progress, error, sourcePhotoUrl, cleanedPhotoUrl, modelGlbUrl, thumbnailUrl]
    DrinkInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string }
        priceCents: { type: integer, minimum: 0 }
        category: { type: string, enum: [signature, classic, seasonal, beer, wine, zero-proof, dish, figure, art, object] }
        realHeightCm: { type: ["number", "null"], minimum: 1, maximum: 500 }
      required: [name, description, priceCents, category]
    DrinkUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string }
        priceCents: { type: integer, minimum: 0 }
        category: { type: string, enum: [signature, classic, seasonal, beer, wine, zero-proof, dish, figure, art, object] }
        realHeightCm: { type: ["number", "null"], minimum: 1, maximum: 500 }
        isAvailable: { type: boolean }
        isPublished: { type: boolean }
        sortOrder: { type: integer }
    Insights:
      type: object
      properties:
        viewsThisWeek: { type: integer }
        mostViewedDrink: { type: ["string", "null"] }
        publishedSignatures: { type: integer }
        lastMenuUpdate: { type: ["string", "null"], format: date-time }
        viewsByDrink:
          type: array
          items:
            $ref: "#/components/schemas/DrinkViews"
      required: [viewsThisWeek, mostViewedDrink, publishedSignatures, lastMenuUpdate, viewsByDrink]
    DrinkViews:
      type: object
      properties:
        drinkName: { type: string }
        views: { type: integer }
      required: [drinkName, views]
    MenuVersion:
      type: object
      properties:
        version: { type: integer }
      required: [version]
    PublicMenu:
      type: object
      properties:
        barName: { type: string }
        logoUrl: { type: ["string", "null"] }
        drinks:
          type: array
          items:
            $ref: "#/components/schemas/PublicDrink"
      required: [barName, logoUrl, drinks]
    PublicDrink:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        price: { type: string }
        priceCents: { type: integer }
        category: { type: string }
        thumbnailUrl: { type: ["string", "null"] }
        modelUsdzUrl: { type: ["string", "null"] }
        modelGlbUrl: { type: ["string", "null"] }
        updatedAt: { type: string, format: date-time }
      required: [id, name, description, price, priceCents, category, thumbnailUrl, modelUsdzUrl, modelGlbUrl, updatedAt]
    UploadUrlRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
      required: [name, size, contentType]
    UploadUrlResponse:
      type: object
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
      required: [uploadURL, objectPath]
    TableCard:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        referenceImageUrl: { type: string, format: uri-reference }
        physicalWidthCm: { type: number, exclusiveMinimum: 0, maximum: 100 }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, name, referenceImageUrl, physicalWidthCm, isActive, createdAt]
    TableCardInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        objectPath: { type: string, pattern: "^/objects/uploads/[a-f0-9-]{36}$" }
        physicalWidthCm: { type: number, exclusiveMinimum: 0, maximum: 100 }
      required: [name, objectPath, physicalWidthCm]
    TableCardUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80, pattern: "\\S" }
        physicalWidthCm: { type: number, minimum: 0.001, maximum: 100 }
        isActive: { type: boolean }
    PublicTableCard:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        referenceImageUrl: { type: string, format: uri }
        physicalWidthCm: { type: number }
      required: [id, name, referenceImageUrl, physicalWidthCm]
    ArEventInput:
      type: object
      properties:
        drinkId: { type: string, minLength: 1, maxLength: 120 }
        eventType: { type: string, enum: [view, ar_open, ar_close] }
      required: [drinkId, eventType]
    PartnerKind:
      type: string
      enum: [venue, artist]
    AccountKind:
      description: What signed up. Venues and artists are places and people guests can find; a creator is an individual making models for themselves.
      type: string
      enum: [venue, artist, creator]
    PlanTier:
      description: What the account is entitled to right now. "founding" is a free Business plan through the pilot.
      type: string
      enum: [free, business, founding]
    BillingPlan:
      type: object
      properties:
        plan: { type: string, enum: [free, business] }
        effective: { $ref: "#/components/schemas/PlanTier" }
        foundingUntil: { type: ["string", "null"], format: date-time }
        liveDisplays: { type: integer }
        liveDisplayLimit: { type: ["integer", "null"], description: "Null means unlimited." }
        buildCredits: { type: integer }
        buildsIncluded: { type: boolean, description: "True when 3D builds do not spend credits." }
        subscriptionStatus: { type: ["string", "null"] }
        currentPeriodEnd: { type: ["string", "null"], format: date-time }
        slot:
          oneOf:
            - type: object
              properties:
                category: { type: string }
                neighborhood: { type: string }
              required: [category, neighborhood]
            - type: "null"
        checkoutAvailable: { type: boolean }
        portalAvailable: { type: boolean }
        prices:
          type: object
          properties:
            businessMonthlyCents: { type: integer }
            buildCreditCents: { type: integer }
          required: [businessMonthlyCents, buildCreditCents]
      required: [plan, effective, foundingUntil, liveDisplays, liveDisplayLimit, buildCredits, buildsIncluded, subscriptionStatus, currentPeriodEnd, slot, checkoutAvailable, portalAvailable, prices]
    CheckoutInput:
      type: object
      additionalProperties: false
      properties:
        product: { type: string, enum: [business, credits] }
        quantity: { type: integer, minimum: 1, maximum: 10, description: "Build credits to buy; ignored for the Business plan." }
        category: { type: string, minLength: 1, maxLength: 40, description: "What the business is known for (tacos, coffee). Defaults to the venue type." }
      required: [product]
    CheckoutUrl:
      type: object
      properties:
