          type: string
          description: Site-relative scan link, for example /s/k7m2x9qp. Prefix it with the public site origin.
        scansThisWeek: { type: integer }
        redemptionsThisWeek: { type: integer }
        createdAt: { type: string, format: date-time }
      required: [id, label, placement, displayId, displayTitle, code, path, scansThisWeek, redemptionsThisWeek, createdAt]
    QrCodeBatchInput:
      type: object
      additionalProperties: false
      properties:
        labels:
          type: array
          minItems: 1
          maxItems: 60
          items: { type: string, minLength: 1, maxLength: 40, pattern: "\\S" }
        placement: { $ref: "#/components/schemas/Placement" }
        displayId: { type: ["string", "null"], maxLength: 120 }
      required: [labels, placement]
    QrCodeUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        label: { type: string, minLength: 1, maxLength: 40, pattern: "\\S" }
        placement: { $ref: "#/components/schemas/Placement" }
        displayId: { type: ["string", "null"], maxLength: 120 }
    TrafficTotals:
      type: object
