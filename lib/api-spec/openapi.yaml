          oneOf:
            - $ref: "#/components/schemas/VenueType"
            - type: "null"
        name: { type: string }
        slug: { type: string }
        bio: { type: string }
        neighborhood: { type: string }
        address: { type: string }
        latitude: { type: ["number", "null"] }
        longitude: { type: ["number", "null"] }
        timezone: { type: string }
        serviceOpen: { type: ["string", "null"], description: "Local opening time HH:MM; null means 17:00." }
        serviceClose: { type: ["string", "null"], description: "Local closing time HH:MM; null means 03:00. Earlier than opening means it crosses midnight." }
      required: [id, kind, plan, venueType, name, slug, bio, neighborhood, address, latitude, longitude, timezone, serviceOpen, serviceClose]
    PartnerProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 80, pattern: "\\S" }
        venueType: { $ref: "#/components/schemas/VenueType" }
        bio: { type: string, maxLength: 600 }
        neighborhood: { type: string, maxLength: 80 }
        address: { type: string, maxLength: 200 }
        latitude: { type: ["number", "null"], minimum: -90, maximum: 90 }
        longitude: { type: ["number", "null"], minimum: -180, maximum: 180 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        serviceOpen: { type: ["string", "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        serviceClose: { type: ["string", "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
    Offer:
      type: object
      properties:
        title: { type: string }
        details: { type: string }
