    OfferInput:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 80, pattern: "\\S" }
        details: { type: string, maxLength: 240 }
        endsAt: { type: ["string", "null"], format: date-time }
      required: [title]
    ArtistCredit:
      type: object
      properties:
        name: { type: string }
        slug: { type: ["string", "null"] }
      required: [name, slug]
    DisplayDrink:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        priceCents: { type: integer }
        thumbnailUrl: { type: ["string", "null"] }
        modelUsdzUrl: { type: ["string", "null"] }
        modelGlbUrl: { type: ["string", "null"] }
        generationStatus: { type: string }
      required: [id, name, priceCents, thumbnailUrl, modelUsdzUrl, modelGlbUrl, generationStatus]
    Display:
      type: object
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/DisplayType" }
        placement: { $ref: "#/components/schemas/Placement" }
        status: { $ref: "#/components/schemas/DisplayStatus" }
        title: { type: string }
        description: { type: string }
        drinkId: { type: ["string", "null"] }
        drink:
          oneOf:
            - $ref: "#/components/schemas/DisplayDrink"
            - type: "null"
        mediaUrl: { type: ["string", "null"] }
        offer:
          oneOf:
            - $ref: "#/components/schemas/Offer"
            - type: "null"
        eventStartsAt: { type: ["string", "null"], format: date-time }
        artist:
          oneOf:
            - $ref: "#/components/schemas/ArtistCredit"
            - type: "null"
        artworkId: { type: ["string", "null"] }
        artwork:
          oneOf:
            - $ref: "#/components/schemas/DisplayArtwork"
