openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Bar owner sign-in
  - name: drinks
    description: Menu management
  - name: insights
    description: Menu performance
  - name: ios
    description: Public iOS app API
  - name: storage
    description: Private bar artwork uploads
  - name: tableCards
    description: Bar-owner table-card management
  - name: partner
    description: Venue and artist partner profiles
  - name: displays
    description: AR displays a partner places in their space
  - name: qrCodes
    description: Placed QR codes, one per table, window, wall or poster
  - name: analytics
    description: Scans, visitors and redemptions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a bar owner and create a private bar menu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerRegistrationInput"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid email or password format
        "401":
          description: Email or password did not match
        "429":
          description: Too many sign-in attempts from this address or for this account
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Email a single-use reset link without disclosing account existence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRecoveryInput"
      responses:
        "200":
          description: Generic acknowledgement for registered and unknown emails
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid email
        "429":
          description: Too many requests
        "503":
          description: Email recovery is not configured
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      summary: Replace a password using an unexpired single-use token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordReplacementInput"
      responses:
        "200":
          description: Password changed; sign in again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid password or invalid, expired, or used token
        "429":
          description: Too many attempts
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /drinks:
    get:
      operationId: listDrinks
      tags: [drinks]
      responses:
        "200":
          description: Bar menu
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Drink"
    post:
      operationId: createDrink
      tags: [drinks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrinkInput"
      responses:
        "201":
          description: Drink created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Drink"
  /drinks/{id}:
    patch:
      operationId: updateDrink
      tags: [drinks]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrinkUpdate"
      responses:
        "200":
          description: Drink updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Drink"
    delete:
      operationId: deleteDrink
      tags: [drinks]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Drink deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /drinks/{id}/photo-cleanup:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getSavedPhotoCleanup
      tags: [drinks]
      summary: Resume the owner's most recent saved photo cleanup
      responses:
        "200":
          description: Saved draft, or null when no cleanup has been started
          content:
            application/json:
              schema:
                type: object
                required: [draft, previousReadyDraft]
                properties:
                  draft:
                    anyOf:
                      - { $ref: "#/components/schemas/SavedPhotoCleanup" }
                      - { type: "null" }
                  previousReadyDraft:
                    description: Earlier saved cutout available when the newest attempt failed
                    anyOf:
                      - { $ref: "#/components/schemas/SavedPhotoCleanup" }
                      - { type: "null" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: savePhotoCleanup
      tags: [drinks]
      summary: Clean a photo and save both private images before approval
      description: Shares the durable four-attempts-per-ten-minute owner limit and one-cleanup lease with the unsaved cleanup endpoint. Failed admitted attempts count. The uploaded cleanup continues if the client disconnects, but has a four-minute server deadline; abandoned leases expire after five minutes.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Saved cutout awaiting explicit approval; does not start Meshy
          content:
            application/json:
              schema:
                type: object
                required: [draft]
                properties:
                  draft: { $ref: "#/components/schemas/SavedPhotoCleanup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/BadRequest" }
        "429":
          description: Cleanup already running or request limit reached
          headers:
            Retry-After:
              description: Seconds until both the owner's current lease and attempt limit permit another cleanup
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/BadRequest" }
        "504":
          description: Cleanup exceeded the server deadline
    # Both images are served through the owner session, never public storage.
  /drinks/{id}/photo-cleanup/{draftId}/{kind}:
    get:
      operationId: getSavedPhotoCleanupImage
      tags: [drinks]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: draftId, in: path, required: true, schema: { type: string } }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [source, cleaned] } }
      responses:
        "200":
          description: Private saved PNG
          content:
            image/png:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/BadRequest" }
  /drinks/photo-cleanup:
    post:
      operationId: cleanupDrinkPhoto
      tags: [drinks]
      summary: Remove a drink photo background using the owner's OpenAI connection
      description: Requires an owner session. Accepts a still image up to 15 MB. Limited to four admitted attempts per owner per ten-minute window and one simultaneous cleanup, shared across server instances and restarts. Failed attempts also count. Abandoned cleanup leases expire after five minutes; requests have a four-minute deadline.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Transparent cleaned PNG; not yet sent to Meshy
          content:
            image/png:
              schema: { type: string, format: binary }
        "400":
          description: Invalid or undecodable photo
        "401":
          description: Owner sign-in required
        "413":
          description: Photo exceeds 15 MB
        "415":
          description: Unsupported photo content type
        "429":
          description: Cleanup already running or request limit reached
          headers:
            Retry-After:
              description: Seconds until both the owner's current lease and attempt limit permit another cleanup
              schema:
                type: integer
                minimum: 1
        "502":
          description: OpenAI rejected or failed the cleanup
        "503":
          description: OpenAI key not configured or shared admission storage unavailable
        "504":
          description: Cleanup exceeded the request deadline
  /drinks/{id}/generation:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      operationId: getDrinkGeneration
      tags: [drinks]
      responses:
        "200":
          description: Current photo-to-3D generation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrinkGeneration"
    post:
      operationId: startDrinkGeneration
      tags: [drinks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrinkGenerationInput"
      responses:
        "200":
          description: Generation task started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrinkGeneration"
        "429":
          description: The partner's daily limit of paid 3D generations is reached
  /drinks/{id}/photos/{kind}:
    get:
      operationId: getDrinkPhoto
      tags: [drinks]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum: [source, cleaned]
      responses:
        "200":
          description: Private drink photo served to its owner
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: Photo not found
  /storage/public-objects/{filePath}:
    get:
      operationId: getPublicDrinkAsset
      tags: [drinks]
      parameters:
        - in: path
          name: filePath
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public iOS menu model or thumbnail asset
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Asset not found
  /storage/drink-photos/request-url:
    post:
      operationId: requestDrinkPhotoUpload
      tags: [drinks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrinkPhotoUploadInput"
      responses:
        "200":
          description: Presigned App Storage upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrinkPhotoUpload"
  /insights:
    get:
      operationId: getInsights
      tags: [insights]
      responses:
        "200":
          description: Menu performance insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Insights"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a signed upload URL for table-card artwork
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Signed upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      parameters:
        - in: path
          name: objectPath
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Private uploaded image
          content:
            image/*:
              schema:
                type: string
                format: binary
  /table-cards:
    get:
      operationId: listTableCards
      tags: [tableCards]
      responses:
        "200":
          description: Table cards for the signed-in bar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TableCard"
    post:
      operationId: createTableCard
      tags: [tableCards]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableCardInput"
      responses:
        "201":
          description: Table card created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableCard"
  /table-cards/{id}:
    patch:
      operationId: updateTableCard
      tags: [tableCards]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableCardUpdate"
      responses:
        "200":
          description: Table card updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableCard"
        "400":
          description: Invalid card details
        "401":
          description: Sign-in required
        "404":
          description: Table card not found for the signed-in bar
    delete:
      operationId: deleteTableCard
      tags: [tableCards]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Table card deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /partner/profile:
    get:
      operationId: getPartnerProfile
      tags: [partner]
      responses:
        "200":
          description: The signed-in venue or artist profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerProfile"
        "401":
          description: Sign-in required
    patch:
      operationId: updatePartnerProfile
      tags: [partner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerProfileUpdate"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerProfile"
        "400":
          description: Invalid profile details
        "401":
          description: Sign-in required
  /displays:
    get:
      operationId: listDisplays
      tags: [displays]
      responses:
        "200":
          description: AR displays owned by the signed-in partner
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Display"
        "401":
          description: Sign-in required
    post:
      operationId: createDisplay
      tags: [displays]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisplayInput"
      responses:
        "201":
          description: Display created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Display"
        "400":
          description: Invalid display details
        "401":
          description: Sign-in required
  /displays/{id}:
    get:
      operationId: getDisplay
      tags: [displays]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: One display
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Display"
        "401":
          description: Sign-in required
        "404":
          description: Display not found for the signed-in partner
    patch:
      operationId: updateDisplay
      tags: [displays]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisplayUpdate"
      responses:
        "200":
          description: Display updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Display"
        "400":
          description: Invalid display details
        "401":
          description: Sign-in required
        "404":
          description: Display not found for the signed-in partner
    delete:
      operationId: deleteDisplay
      tags: [displays]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Display deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          description: Sign-in required
        "404":
          description: Display not found for the signed-in partner
  /qr-codes:
    get:
      operationId: listQrCodes
      tags: [qrCodes]
      responses:
        "200":
          description: QR codes placed by the signed-in partner
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QrCode"
        "401":
          description: Sign-in required
    post:
      operationId: createQrCodes
      tags: [qrCodes]
      summary: Create one QR code per label, all with the same placement and display
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QrCodeBatchInput"
      responses:
        "201":
          description: QR codes created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QrCode"
        "400":
          description: Invalid QR code details
        "401":
          description: Sign-in required
  /qr-codes/{id}:
    patch:
      operationId: updateQrCode
      tags: [qrCodes]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QrCodeUpdate"
      responses:
        "200":
          description: QR code updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QrCode"
        "400":
          description: Invalid QR code details
        "401":
          description: Sign-in required
        "404":
          description: QR code not found for the signed-in partner
    delete:
      operationId: deleteQrCode
      tags: [qrCodes]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: QR code retired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          description: Sign-in required
        "404":
          description: QR code not found for the signed-in partner
  /analytics:
    get:
      operationId: getAnalytics
      tags: [analytics]
      parameters:
        - in: query
          name: range
          required: false
          schema:
            type: string
            enum: [week, month, season]
      responses:
        "200":
          description: Foot-traffic numbers for the signed-in partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analytics"
        "400":
          description: Unknown range
        "401":
          description: Sign-in required
  /redemptions:
    get:
      operationId: listRedemptions
      tags: [analytics]
      responses:
        "200":
          description: The 50 most recent offer claims, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Redemption"
        "401":
          description: Sign-in required
  /artist/placements:
    get:
      operationId: listArtistPlacements
      tags: [partner]
      responses:
        "200":
          description: Venues currently hosting the signed-in artist's pieces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtistPlacement"
        "401":
          description: Sign-in required
  /artists:
    get:
      operationId: searchArtists
      tags: [partner]
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
            maxLength: 80
      responses:
        "200":
          description: Artist partners a venue can credit on a display
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtistSearchResult"
        "401":
          description: Sign-in required
  /v1/bars/{slug}/menu-version:
    get:
      operationId: getPublicMenuVersion
      tags: [ios]
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
        - in: header
          name: x-api-key
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current menu version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuVersion"
        "401":
          description: Missing or invalid iOS API key
        "503":
          description: iOS API key is not configured
        "429":
          description: Rate limit exceeded
  /v1/bars/{slug}/menu:
    get:
      operationId: getPublicMenu
      tags: [ios]
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
        - in: header
          name: x-api-key
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Published menu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMenu"
        "401":
          description: Missing or invalid iOS API key
        "503":
          description: iOS API key is not configured
        "429":
          description: Rate limit exceeded
  /v1/bars/{slug}/table-cards:
    get:
      operationId: getPublicTableCards
      tags: [ios]
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
        - in: header
          name: x-api-key
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Active table cards for the bar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicTableCard"
        "401":
          description: Missing or invalid iOS API key
        "503":
          description: iOS API key is not configured
        "429":
          description: Rate limit exceeded
  /v1/bars/{slug}/events:
    post:
      operationId: createPublicEvent
      tags: [ios]
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
        - in: header
          name: x-api-key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArEventInput"
      responses:
        "201":
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Event input is invalid
        "401":
          description: Missing or invalid iOS API key
        "404":
          description: Bar or drink not found
        "503":
          description: iOS API key is not configured
        "429":
          description: Rate limit exceeded
  /v1/scans:
    post:
      operationId: createPublicScan
      tags: [ios]
      summary: Record a guest scan of a placed QR code and return what to show
      parameters:
        - in: header
          name: x-api-key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanInput"
      responses:
        "200":
          description: Scan recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"
        "400":
          description: Scan input is invalid
        "401":
          description: Missing or invalid iOS API key
        "404":
          description: Unknown or retired QR code
        "503":
          description: iOS API key is not configured
        "429":
          description: Rate limit exceeded
  /v1/venues/{slug}:
    get:
      operationId: getPublicVenue
      tags: [ios]
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
        - in: header
          name: x-api-key
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A partner and its live displays
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicVenue"
        "401":
          description: Missing or invalid iOS API key
        "404":
          description: Partner not found
        "503":
          description: iOS API key is not configured
        "429":
          description: Rate limit exceeded
  /v1/venues/{slug}/nearby:
    get:
      operationId: getPublicNearby
      tags: [ios]
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
        - in: header
          name: x-api-key
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Other partners within walking distance, nearest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NearbySpot"
        "401":
          description: Missing or invalid iOS API key
        "404":
          description: Partner not found
        "503":
          description: iOS API key is not configured
        "429":
          description: Rate limit exceeded
  /v1/artists/{slug}:
    get:
      operationId: getPublicArtist
      tags: [ios]
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
        - in: header
          name: x-api-key
          required: true
          schema:
            type: string
      responses:
        "200":
          description: An artist and where their live pieces can be seen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicArtist"
        "401":
          description: Missing or invalid iOS API key
        "404":
          description: Artist not found
        "503":
          description: iOS API key is not configured
        "429":
          description: Rate limit exceeded
  /v1/displays/{id}/claims:
    post:
      operationId: createPublicClaim
      tags: [ios]
      summary: Claim a display's offer; repeating a claim the same day returns the same claim
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: x-api-key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimInput"
      responses:
        "200":
          description: This guest already claimed this offer today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        "201":
          description: Offer claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        "400":
          description: Claim input is invalid
        "401":
          description: Missing or invalid iOS API key
        "404":
          description: Display not found, not live, or has no offer
        "410":
          description: The offer has ended
        "503":
          description: iOS API key is not configured
        "429":
          description: Rate limit exceeded
components:
  responses:
    Unauthorized:
      description: Owner sign-in required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found for this owner
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: The request could not be completed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    SavedPhotoCleanup:
      type: object
      required: [id, drinkId, status, sourcePhotoPath, cleanedPhotoPath, error, createdAt]
      properties:
        id: { type: string }
        drinkId: { type: string }
        status: { type: string, enum: [processing, ready, failed, discarded] }
        sourcePhotoPath: { type: string }
        cleanedPhotoPath: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Message:
      type: object
      properties:
        message: { type: string }
      required: [message]
    Session:
      type: object
      properties:
        authenticated: { type: boolean }
        userName: { type: ["string", "null"] }
        barName: { type: ["string", "null"] }
        barSlug: { type: ["string", "null"] }
        partnerKind:
          oneOf:
            - $ref: "#/components/schemas/PartnerKind"
            - type: "null"
      required: [authenticated, userName, barName, barSlug, partnerKind]
    PasswordRecoveryInput:
      type: object
      properties:
        email: { type: string, format: email, maxLength: 254 }
      required: [email]
    PasswordReplacementInput:
      type: object
      properties:
        token: { type: string, pattern: "^[A-Za-z0-9_-]{43}$", minLength: 43, maxLength: 43 }
        password: { type: string, minLength: 12, maxLength: 72 }
      required: [token, password]
    LoginInput:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 72 }
      required: [email, password]
    OwnerRegistrationInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        barName: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 72 }
        kind: { $ref: "#/components/schemas/PartnerKind" }
      required: [name, barName, email, password]
    Drink:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        priceCents: { type: integer }
        category: { type: string }
        isAvailable: { type: boolean }
        isPublished: { type: boolean }
        sortOrder: { type: integer }
        thumbnailUrl: { type: ["string", "null"] }
        generationStatus: { type: string }
        generationProgress: { type: integer }
        modelGlbUrl: { type: ["string", "null"], format: uri }
        modelUsdzUrl: { type: ["string", "null"], format: uri }
        generationError: { type: ["string", "null"] }
        updatedAt: { type: string, format: date-time }
        realHeightCm:
          type: ["number", "null"]
          description: Real-world height in centimetres the AR app renders this model at; null uses the app default.
      required: [id, name, description, priceCents, category, isAvailable, isPublished, sortOrder, thumbnailUrl, generationStatus, generationProgress, modelGlbUrl, modelUsdzUrl, generationError, updatedAt, realHeightCm]
    DrinkPhotoUploadInput:
      type: object
      properties:
        drinkId: { type: string }
        kind: { type: string, enum: [original, cleaned] }
        name: { type: string, minLength: 1, maxLength: 255 }
        size:
          type: integer
          minimum: 1
          description: Image byte size; no greater than 15728640 (15 MB).
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
      required: [drinkId, kind, name, size, contentType]
    DrinkPhotoUpload:
      type: object
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
      required: [uploadURL, objectPath]
    DrinkGenerationInput:
      type: object
      properties:
        sourcePhotoPath: { type: string, minLength: 1 }
        cleanedPhotoPath: { type: string, minLength: 1 }
      required: [sourcePhotoPath, cleanedPhotoPath]
    DrinkGeneration:
      type: object
      properties:
        status: { type: string, enum: [none, uploaded, processing, ready, failed] }
        progress:
          type: integer
          description: Generation progress from 0 to 100.
        error: { type: ["string", "null"] }
        sourcePhotoUrl: { type: ["string", "null"], format: uri }
        cleanedPhotoUrl: { type: ["string", "null"], format: uri }
        modelGlbUrl: { type: ["string", "null"], format: uri }
        thumbnailUrl: { type: ["string", "null"], format: uri }
      required: [status, progress, error, sourcePhotoUrl, cleanedPhotoUrl, modelGlbUrl, thumbnailUrl]
    DrinkInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string }
        priceCents: { type: integer, minimum: 0 }
        category: { type: string, enum: [signature, classic, seasonal, beer, wine, zero-proof, dish, figure, art, object] }
        realHeightCm: { type: ["number", "null"], minimum: 1, maximum: 500 }
      required: [name, description, priceCents, category]
    DrinkUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string }
        priceCents: { type: integer, minimum: 0 }
        category: { type: string, enum: [signature, classic, seasonal, beer, wine, zero-proof, dish, figure, art, object] }
        realHeightCm: { type: ["number", "null"], minimum: 1, maximum: 500 }
        isAvailable: { type: boolean }
        isPublished: { type: boolean }
        sortOrder: { type: integer }
    Insights:
      type: object
      properties:
        viewsThisWeek: { type: integer }
        mostViewedDrink: { type: ["string", "null"] }
        publishedSignatures: { type: integer }
        lastMenuUpdate: { type: ["string", "null"], format: date-time }
        viewsByDrink:
          type: array
          items:
            $ref: "#/components/schemas/DrinkViews"
      required: [viewsThisWeek, mostViewedDrink, publishedSignatures, lastMenuUpdate, viewsByDrink]
    DrinkViews:
      type: object
      properties:
        drinkName: { type: string }
        views: { type: integer }
      required: [drinkName, views]
    MenuVersion:
      type: object
      properties:
        version: { type: integer }
      required: [version]
    PublicMenu:
      type: object
      properties:
        barName: { type: string }
        logoUrl: { type: ["string", "null"] }
        drinks:
          type: array
          items:
            $ref: "#/components/schemas/PublicDrink"
      required: [barName, logoUrl, drinks]
    PublicDrink:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        price: { type: string }
        priceCents: { type: integer }
        category: { type: string }
        thumbnailUrl: { type: ["string", "null"] }
        modelUsdzUrl: { type: ["string", "null"] }
        modelGlbUrl: { type: ["string", "null"] }
        updatedAt: { type: string, format: date-time }
      required: [id, name, description, price, priceCents, category, thumbnailUrl, modelUsdzUrl, modelGlbUrl, updatedAt]
    UploadUrlRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
      required: [name, size, contentType]
    UploadUrlResponse:
      type: object
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
      required: [uploadURL, objectPath]
    TableCard:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        referenceImageUrl: { type: string, format: uri-reference }
        physicalWidthCm: { type: number, exclusiveMinimum: 0, maximum: 100 }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, name, referenceImageUrl, physicalWidthCm, isActive, createdAt]
    TableCardInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        objectPath: { type: string, pattern: "^/objects/uploads/[a-f0-9-]{36}$" }
        physicalWidthCm: { type: number, exclusiveMinimum: 0, maximum: 100 }
      required: [name, objectPath, physicalWidthCm]
    TableCardUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80, pattern: "\\S" }
        physicalWidthCm: { type: number, minimum: 0.001, maximum: 100 }
        isActive: { type: boolean }
    PublicTableCard:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        referenceImageUrl: { type: string, format: uri }
        physicalWidthCm: { type: number }
      required: [id, name, referenceImageUrl, physicalWidthCm]
    ArEventInput:
      type: object
      properties:
        drinkId: { type: string, minLength: 1, maxLength: 120 }
        eventType: { type: string, enum: [view, ar_open, ar_close] }
      required: [drinkId, eventType]
    PartnerKind:
      type: string
      enum: [venue, artist]
    DisplayType:
      type: string
      enum: [menu_item, promo_offer, art_piece, event_teaser]
    Placement:
      type: string
      enum: [table, wall, window, poster]
    DisplayStatus:
      type: string
      enum: [draft, live, paused]
    PartnerProfile:
      type: object
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/PartnerKind" }
        name: { type: string }
        slug: { type: string }
        bio: { type: string }
        neighborhood: { type: string }
        address: { type: string }
        latitude: { type: ["number", "null"] }
        longitude: { type: ["number", "null"] }
        timezone: { type: string }
      required: [id, kind, name, slug, bio, neighborhood, address, latitude, longitude, timezone]
    PartnerProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 80, pattern: "\\S" }
        bio: { type: string, maxLength: 600 }
        neighborhood: { type: string, maxLength: 80 }
        address: { type: string, maxLength: 200 }
        latitude: { type: ["number", "null"], minimum: -90, maximum: 90 }
        longitude: { type: ["number", "null"], minimum: -180, maximum: 180 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
    Offer:
      type: object
      properties:
        title: { type: string }
        details: { type: string }
        endsAt: { type: ["string", "null"], format: date-time }
      required: [title, details, endsAt]
    OfferInput:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 80, pattern: "\\S" }
        details: { type: string, maxLength: 240 }
        endsAt: { type: ["string", "null"], format: date-time }
      required: [title]
    ArtistCredit:
      type: object
      properties:
        name: { type: string }
        slug: { type: ["string", "null"] }
      required: [name, slug]
    DisplayDrink:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        priceCents: { type: integer }
        thumbnailUrl: { type: ["string", "null"] }
        modelUsdzUrl: { type: ["string", "null"] }
        modelGlbUrl: { type: ["string", "null"] }
        generationStatus: { type: string }
      required: [id, name, priceCents, thumbnailUrl, modelUsdzUrl, modelGlbUrl, generationStatus]
    Display:
      type: object
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/DisplayType" }
        placement: { $ref: "#/components/schemas/Placement" }
        status: { $ref: "#/components/schemas/DisplayStatus" }
        title: { type: string }
        description: { type: string }
        drinkId: { type: ["string", "null"] }
        drink:
          oneOf:
            - $ref: "#/components/schemas/DisplayDrink"
            - type: "null"
        mediaUrl: { type: ["string", "null"] }
        offer:
          oneOf:
            - $ref: "#/components/schemas/Offer"
            - type: "null"
        eventStartsAt: { type: ["string", "null"], format: date-time }
        artist:
          oneOf:
            - $ref: "#/components/schemas/ArtistCredit"
            - type: "null"
        scansThisWeek: { type: integer }
        redemptionsThisWeek: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, type, placement, status, title, description, drinkId, drink, mediaUrl, offer, eventStartsAt, artist, scansThisWeek, redemptionsThisWeek, createdAt, updatedAt]
    DisplayInput:
      type: object
      additionalProperties: false
      properties:
        type: { $ref: "#/components/schemas/DisplayType" }
        placement: { $ref: "#/components/schemas/Placement" }
        status: { type: string, enum: [draft, live] }
        title: { type: string, minLength: 1, maxLength: 80, pattern: "\\S" }
        description: { type: string, maxLength: 600 }
        drinkId: { type: ["string", "null"], maxLength: 120 }
        mediaObjectPath: { type: ["string", "null"], pattern: "^/objects/uploads/[a-f0-9-]{36}$" }
        offer:
          oneOf:
            - $ref: "#/components/schemas/OfferInput"
            - type: "null"
        eventStartsAt: { type: ["string", "null"], format: date-time }
        artistName: { type: ["string", "null"], maxLength: 80 }
        artistSlug: { type: ["string", "null"], maxLength: 120 }
      required: [type, placement, title]
    DisplayUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        placement: { $ref: "#/components/schemas/Placement" }
        status: { $ref: "#/components/schemas/DisplayStatus" }
        title: { type: string, minLength: 1, maxLength: 80, pattern: "\\S" }
        description: { type: string, maxLength: 600 }
        drinkId: { type: ["string", "null"], maxLength: 120 }
        mediaObjectPath: { type: ["string", "null"], pattern: "^/objects/uploads/[a-f0-9-]{36}$" }
        offer:
          oneOf:
            - $ref: "#/components/schemas/OfferInput"
            - type: "null"
        eventStartsAt: { type: ["string", "null"], format: date-time }
        artistName: { type: ["string", "null"], maxLength: 80 }
        artistSlug: { type: ["string", "null"], maxLength: 120 }
    QrCode:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        placement: { $ref: "#/components/schemas/Placement" }
        displayId: { type: ["string", "null"] }
        displayTitle: { type: ["string", "null"] }
        code: { type: string }
        path:
          type: string
          description: Site-relative scan link, for example /s/k7m2x9qp. Prefix it with the public site origin.
        scansThisWeek: { type: integer }
        redemptionsThisWeek: { type: integer }
        createdAt: { type: string, format: date-time }
      required: [id, label, placement, displayId, displayTitle, code, path, scansThisWeek, redemptionsThisWeek, createdAt]
    QrCodeBatchInput:
      type: object
      additionalProperties: false
      properties:
        labels:
          type: array
          minItems: 1
          maxItems: 60
          items: { type: string, minLength: 1, maxLength: 40, pattern: "\\S" }
        placement: { $ref: "#/components/schemas/Placement" }
        displayId: { type: ["string", "null"], maxLength: 120 }
      required: [labels, placement]
    QrCodeUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        label: { type: string, minLength: 1, maxLength: 40, pattern: "\\S" }
        placement: { $ref: "#/components/schemas/Placement" }
        displayId: { type: ["string", "null"], maxLength: 120 }
    TrafficTotals:
      type: object
      properties:
        scans: { type: integer }
        uniqueVisitors: { type: integer }
        repeatVisitors: { type: integer }
        redemptions: { type: integer }
      required: [scans, uniqueVisitors, repeatVisitors, redemptions]
    TrafficDay:
      type: object
      properties:
        date: { type: string, description: "Calendar day in the partner's timezone, YYYY-MM-DD" }
        scans: { type: integer }
        redemptions: { type: integer }
      required: [date, scans, redemptions]
    TrafficByDisplay:
      type: object
      properties:
        displayId: { type: string }
        title: { type: string }
        type: { $ref: "#/components/schemas/DisplayType" }
        placement: { $ref: "#/components/schemas/Placement" }
        scans: { type: integer }
        redemptions: { type: integer }
      required: [displayId, title, type, placement, scans, redemptions]
    TrafficByQrCode:
      type: object
      properties:
        qrCodeId: { type: string }
        label: { type: string }
        scans: { type: integer }
        redemptions: { type: integer }
      required: [qrCodeId, label, scans, redemptions]
    Analytics:
      type: object
      properties:
        range: { type: string, enum: [week, month, season] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        timezone: { type: string }
        totals: { $ref: "#/components/schemas/TrafficTotals" }
        previous: { $ref: "#/components/schemas/TrafficTotals" }
        series:
          type: array
          items: { $ref: "#/components/schemas/TrafficDay" }
        heatmap:
          type: array
          description: Seven rows, Monday first, of 24 hourly scan counts in the partner's timezone.
          items:
            type: array
            items: { type: integer }
        byDisplay:
          type: array
          items: { $ref: "#/components/schemas/TrafficByDisplay" }
        byQrCode:
          type: array
          items: { $ref: "#/components/schemas/TrafficByQrCode" }
      required: [range, from, to, timezone, totals, previous, series, heatmap, byDisplay, byQrCode]
    Redemption:
      type: object
      properties:
        id: { type: string }
        confirmationCode: { type: string }
        displayId: { type: ["string", "null"] }
        displayTitle: { type: string }
        offerTitle: { type: string }
        spotLabel: { type: ["string", "null"] }
        claimedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
      required: [id, confirmationCode, displayId, displayTitle, offerTitle, spotLabel, claimedAt, expiresAt]
    ArtistPlacement:
      type: object
      properties:
        displayId: { type: string }
        title: { type: string }
        venueName: { type: string }
        venueSlug: { type: string }
        neighborhood: { type: string }
        placement: { $ref: "#/components/schemas/Placement" }
        status: { $ref: "#/components/schemas/DisplayStatus" }
        scansThisWeek: { type: integer }
      required: [displayId, title, venueName, venueSlug, neighborhood, placement, status, scansThisWeek]
    ArtistSearchResult:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        neighborhood: { type: string }
      required: [slug, name, neighborhood]
    PublicVenueSummary:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/PartnerKind" }
        neighborhood: { type: string }
        bio: { type: string }
      required: [slug, name, kind, neighborhood, bio]
    PublicOffer:
      type: object
      properties:
        title: { type: string }
        details: { type: string }
        endsAt: { type: ["string", "null"], format: date-time }
      required: [title, details, endsAt]
    PublicArtistCredit:
      type: object
      properties:
        name: { type: string }
        slug: { type: ["string", "null"] }
        bio: { type: ["string", "null"] }
      required: [name, slug, bio]
    PublicDisplay:
      type: object
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/DisplayType" }
        placement: { $ref: "#/components/schemas/Placement" }
        title: { type: string }
        description: { type: string }
        mediaUrl: { type: ["string", "null"] }
        thumbnailUrl: { type: ["string", "null"] }
        modelUsdzUrl: { type: ["string", "null"] }
        modelGlbUrl: { type: ["string", "null"] }
        modelHeightCm:
          type: ["number", "null"]
          description: Real-world height in centimetres to render the model at; null means the app default.
        price: { type: ["string", "null"] }
        offer:
          oneOf:
            - $ref: "#/components/schemas/PublicOffer"
            - type: "null"
