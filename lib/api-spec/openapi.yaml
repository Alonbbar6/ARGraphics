openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Bar owner sign-in
  - name: drinks
    description: Menu management
  - name: insights
    description: Menu performance
  - name: ios
    description: Public iOS app API
  - name: storage
    description: Private bar artwork uploads
  - name: tableCards
    description: Bar-owner table-card management
  - name: partner
    description: Venue and artist partner profiles
  - name: displays
    description: AR displays a partner places in their space
  - name: qrCodes
    description: Placed QR codes, one per table, window, wall or poster
  - name: billing
    description: Plans, build credits and Stripe checkout
  - name: analytics
    description: Scans, visitors and redemptions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a bar owner and create a private bar menu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerRegistrationInput"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid email or password format
        "401":
          description: Email or password did not match
        "429":
          description: Too many sign-in attempts from this address or for this account
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Email a single-use reset link without disclosing account existence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRecoveryInput"
      responses:
        "200":
          description: Generic acknowledgement for registered and unknown emails
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid email
        "429":
          description: Too many requests
        "503":
          description: Email recovery is not configured
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      summary: Replace a password using an unexpired single-use token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordReplacementInput"
      responses:
        "200":
          description: Password changed; sign in again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid password or invalid, expired, or used token
        "429":
          description: Too many attempts
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /drinks:
    get:
      operationId: listDrinks
      tags: [drinks]
      responses:
        "200":
          description: Bar menu
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Drink"
    post:
      operationId: createDrink
      tags: [drinks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrinkInput"
      responses:
        "201":
          description: Drink created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Drink"
  /drinks/{id}:
    patch:
      operationId: updateDrink
      tags: [drinks]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrinkUpdate"
      responses:
        "200":
          description: Drink updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Drink"
    delete:
      operationId: deleteDrink
      tags: [drinks]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Drink deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /drinks/{id}/photo-cleanup:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getSavedPhotoCleanup
      tags: [drinks]
      summary: Resume the owner's most recent saved photo cleanup
      responses:
        "200":
          description: Saved draft, or null when no cleanup has been started
          content:
            application/json:
              schema:
                type: object
                required: [draft, previousReadyDraft]
                properties:
                  draft:
                    anyOf:
                      - { $ref: "#/components/schemas/SavedPhotoCleanup" }
                      - { type: "null" }
                  previousReadyDraft:
                    description: Earlier saved cutout available when the newest attempt failed
                    anyOf:
                      - { $ref: "#/components/schemas/SavedPhotoCleanup" }
                      - { type: "null" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: savePhotoCleanup
      tags: [drinks]
      summary: Clean a photo and save both private images before approval
      description: Shares the durable four-attempts-per-ten-minute owner limit and one-cleanup lease with the unsaved cleanup endpoint. Failed admitted attempts count. The uploaded cleanup continues if the client disconnects, but has a four-minute server deadline; abandoned leases expire after five minutes.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Saved cutout awaiting explicit approval; does not start Meshy
          content:
            application/json:
              schema:
                type: object
                required: [draft]
                properties:
                  draft: { $ref: "#/components/schemas/SavedPhotoCleanup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/BadRequest" }
        "429":
          description: Cleanup already running or request limit reached
          headers:
            Retry-After:
              description: Seconds until both the owner's current lease and attempt limit permit another cleanup
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/BadRequest" }
        "504":
          description: Cleanup exceeded the server deadline
    # Both images are served through the owner session, never public storage.
  /drinks/{id}/photo-cleanup/{draftId}/{kind}:
    get:
      operationId: getSavedPhotoCleanupImage
      tags: [drinks]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: draftId, in: path, required: true, schema: { type: string } }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [source, cleaned] } }
      responses:
        "200":
          description: Private saved PNG
          content:
            image/png:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/BadRequest" }
  /drinks/photo-cleanup:
    post:
      operationId: cleanupDrinkPhoto
      tags: [drinks]
      summary: Remove a drink photo background using the owner's OpenAI connection
      description: Requires an owner session. Accepts a still image up to 15 MB. Limited to four admitted attempts per owner per ten-minute window and one simultaneous cleanup, shared across server instances and restarts. Failed attempts also count. Abandoned cleanup leases expire after five minutes; requests have a four-minute deadline.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Transparent cleaned PNG; not yet sent to Meshy
          content:
            image/png:
              schema: { type: string, format: binary }
        "400":
          description: Invalid or undecodable photo
        "401":
          description: Owner sign-in required
        "413":
          description: Photo exceeds 15 MB
        "415":
          description: Unsupported photo content type
        "429":
          description: Cleanup already running or request limit reached
          headers:
            Retry-After:
              description: Seconds until both the owner's current lease and attempt limit permit another cleanup
              schema:
                type: integer
                minimum: 1
        "502":
          description: OpenAI rejected or failed the cleanup
        "503":
          description: OpenAI key not configured or shared admission storage unavailable
        "504":
          description: Cleanup exceeded the request deadline
  /drinks/{id}/generation:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      operationId: getDrinkGeneration
      tags: [drinks]
      responses:
        "200":
          description: Current photo-to-3D generation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrinkGeneration"
    post:
      operationId: startDrinkGeneration
      tags: [drinks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrinkGenerationInput"
      responses:
        "200":
          description: Generation task started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrinkGeneration"
        "402":
          description: No build credits left on a free account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: The partner's daily limit of paid 3D generations is reached
  /drinks/{id}/photos/{kind}:
    get:
      operationId: getDrinkPhoto
      tags: [drinks]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum: [source, cleaned]
      responses:
        "200":
          description: Private drink photo served to its owner
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: Photo not found
  /storage/public-objects/{filePath}:
    get:
      operationId: getPublicDrinkAsset
      tags: [drinks]
      parameters:
        - in: path
          name: filePath
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public iOS menu model or thumbnail asset
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Asset not found
  /storage/drink-photos/request-url:
    post:
      operationId: requestDrinkPhotoUpload
      tags: [drinks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrinkPhotoUploadInput"
      responses:
        "200":
          description: Presigned App Storage upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrinkPhotoUpload"
  /insights:
    get:
      operationId: getInsights
      tags: [insights]
      responses:
        "200":
          description: Menu performance insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Insights"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a signed upload URL for table-card artwork
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Signed upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      parameters:
        - in: path
          name: objectPath
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Private uploaded image
          content:
            image/*:
              schema:
                type: string
                format: binary
  /table-cards:
    get:
      operationId: listTableCards
      tags: [tableCards]
      responses:
        "200":
          description: Table cards for the signed-in bar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TableCard"
    post:
      operationId: createTableCard
      tags: [tableCards]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableCardInput"
      responses:
        "201":
          description: Table card created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableCard"
  /table-cards/{id}:
    patch:
      operationId: updateTableCard
      tags: [tableCards]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableCardUpdate"
      responses:
        "200":
          description: Table card updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableCard"
        "400":
          description: Invalid card details
        "401":
          description: Sign-in required
        "404":
          description: Table card not found for the signed-in bar
    delete:
      operationId: deleteTableCard
      tags: [tableCards]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Table card deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /billing/plan:
    get:
      operationId: getBillingPlan
      tags: [billing]
      summary: The signed-in partner's plan, limits and credits
      responses:
        "200":
          description: Plan state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPlan"
        "401":
          description: Sign-in required
  /billing/checkout:
    post:
      operationId: createCheckout
      tags: [billing]
      summary: Start a Stripe Checkout for the Business plan or build credits
      description: For the Business plan the partner's (category, neighborhood) slot is reserved before Checkout opens, so a taken slot answers 409 and nobody pays for exclusivity they cannot have.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "200":
          description: Redirect the browser here
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutUrl"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Sign-in required
        "409":
          description: Already on this plan, or the exclusivity slot is taken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Stripe could not be reached
        "503":
          description: Billing is not configured
  /billing/portal:
    post:
      operationId: createBillingPortal
      tags: [billing]
      summary: Open the Stripe customer portal to manage or cancel the subscription
      responses:
        "200":
          description: Redirect the browser here
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutUrl"
        "401":
          description: Sign-in required
        "404":
          description: No billing account yet
        "503":
          description: Billing is not configured
  /billing/webhook:
    post:
      operationId: receiveStripeWebhook
      tags: [billing]
      summary: Stripe event delivery (signed; not for the dashboard)
      description: Mounted ahead of the JSON parser so the raw body can be verified against STRIPE_WEBHOOK_SECRET. Each event id is handled once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeEvent"
      responses:
        "200":
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Bad signature
        "503":
          description: Billing is not configured
  /partner/profile:
    get:
      operationId: getPartnerProfile
      tags: [partner]
      responses:
        "200":
          description: The signed-in venue or artist profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerProfile"
        "401":
          description: Sign-in required
    patch:
      operationId: updatePartnerProfile
      tags: [partner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerProfileUpdate"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerProfile"
        "400":
          description: Invalid profile details
        "401":
          description: Sign-in required
  /displays:
    get:
      operationId: listDisplays
      tags: [displays]
      responses:
        "200":
          description: AR displays owned by the signed-in partner
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Display"
        "401":
          description: Sign-in required
    post:
      operationId: createDisplay
      tags: [displays]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisplayInput"
      responses:
        "201":
          description: Display created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Display"
        "402":
          description: Live-display limit of the free plan reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400":
          description: Invalid display details
        "401":
          description: Sign-in required
  /displays/{id}:
    get:
      operationId: getDisplay
      tags: [displays]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: One display
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Display"
        "401":
          description: Sign-in required
        "404":
          description: Display not found for the signed-in partner
    patch:
      operationId: updateDisplay
      tags: [displays]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisplayUpdate"
      responses:
        "200":
          description: Display updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Display"
        "402":
          description: Live-display limit of the free plan reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400":
          description: Invalid display details
        "401":
          description: Sign-in required
        "404":
          description: Display not found for the signed-in partner
    delete:
      operationId: deleteDisplay
      tags: [displays]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Display deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          description: Sign-in required
        "404":
          description: Display not found for the signed-in partner
  /qr-codes:
    get:
      operationId: listQrCodes
      tags: [qrCodes]
      responses:
        "200":
          description: QR codes placed by the signed-in partner
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QrCode"
        "401":
          description: Sign-in required
    post:
      operationId: createQrCodes
      tags: [qrCodes]
      summary: Create one QR code per label, all with the same placement and display
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QrCodeBatchInput"
      responses:
        "201":
          description: QR codes created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QrCode"
        "400":
          description: Invalid QR code details
        "401":
          description: Sign-in required
  /qr-codes/{id}:
    patch:
      operationId: updateQrCode
      tags: [qrCodes]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QrCodeUpdate"
      responses:
        "200":
          description: QR code updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QrCode"
        "400":
          description: Invalid QR code details
        "401":
          description: Sign-in required
        "404":
          description: QR code not found for the signed-in partner
    delete:
      operationId: deleteQrCode
      tags: [qrCodes]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: QR code retired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          description: Sign-in required
        "404":
          description: QR code not found for the signed-in partner
  /analytics:
    get:
      operationId: getAnalytics
      tags: [analytics]
      parameters:
        - in: query
          name: range
          required: false
          schema:
            type: string
            enum: [week, month, season]
      responses:
        "200":
          description: Foot-traffic numbers for the signed-in partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analytics"
        "400":
          description: Unknown range
        "401":
          description: Sign-in required
  /live:
    get:
      operationId: getLiveBoard
      tags: [analytics]
      summary: What is happening in the room right now
      parameters:
        - in: query
          name: since
          required: false
          description: Only return events after this instant (ISO 8601); counts are always complete.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Tonight's and last night's numbers plus the newest scans and claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveBoard"
        "400":
          description: Invalid since
        "401":
          description: Sign-in required
  /redemptions:
    get:
      operationId: listRedemptions
      tags: [analytics]
      responses:
        "200":
          description: The 50 most recent offer claims, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Redemption"
        "401":
          description: Sign-in required
  /artist/placements:
    get:
      operationId: listArtistPlacements
      tags: [partner]
      responses:
        "200":
          description: Venues currently hosting the signed-in artist's pieces
          content:
            application/json:
              schema:
                type: array
                items:
