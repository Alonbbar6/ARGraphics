name: Generated API freshness

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  api-codegen:
    runs-on: ubuntu-latest
    steps:
      - name: Check out committed source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test the freshness check
        run: pnpm run test:api-codegen-check
      - name: Regenerate and compare committed API outputs
        run: pnpm run check:api-codegen
